name: Lab04 Docker and Newman Verification

on:
  push:
  pull_request:

jobs:
  docker-newman:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Lint OpenAPI contract
        run: npm run lint:openapi

      - name: Build Docker image
        run: docker build -t fit4110/iot-ingestion:lab04 .

      - name: Run Docker container
        run: |
          docker run -d --rm \
            --name fit4110-iot-lab04 \
            -p 8000:8000 \
            --env-file .env.example \
            fit4110/iot-ingestion:lab04

      - name: Wait for container to be ready
        run: |
          echo "Waiting for Docker container to start..."
          sleep 5
          
          echo "Checking container status..."
          docker ps -a --filter "name=fit4110"
          
          echo "Container logs:"
          docker logs fit4110-iot-lab04 | tail -20 || echo "No logs yet"
          
          echo "Waiting for health endpoint..."
          TIMEOUT=120
          ELAPSED=0
          INTERVAL=2
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            echo "[$ELAPSED/$TIMEOUT] Checking http://localhost:8000/health..."
            
            if curl -s -f -m 5 http://localhost:8000/health > /dev/null 2>&1; then
              echo "✓ Service is healthy!"
              curl -s http://localhost:8000/health | head -20
              exit 0
            fi
            
            echo "Service not ready yet, retrying in ${INTERVAL}s..."
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          echo "✗ Timeout waiting for service health check"
          echo "Final container logs:"
          docker logs fit4110-iot-lab04 | tail -50
          exit 1

      - name: Run Newman against Docker container
        run: npm run test:local

      - name: Show container logs on failure
        if: failure()
        run: docker logs fit4110-iot-lab04 || true

      - name: Stop container
        if: always()
        run: docker stop fit4110-iot-lab04 || true

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab04-newman-reports
          path: reports/
